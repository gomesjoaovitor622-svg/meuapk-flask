services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: meuapk-flask:local
    env_file:
      - ../.env
    environment:
      FLASK_ENV: prod
      DATABASE_URL: sqlite:////data/meuapk.db
      SESSION_COOKIE_SECURE: "false"
    ports:
      - "8000:8000"
    volumes:
      - dados:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  dados:
