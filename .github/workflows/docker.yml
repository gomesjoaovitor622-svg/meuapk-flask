name: Docker

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build da imagem
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build
        run: docker build -f deploy/Dockerfile -t meuapk-flask:ci .

      - name: Smoke test do container
        run: |
          docker run -d --name app -p 8000:8000 -e SECRET_KEY=chave-de-ci-com-32-caracteres-ok -e FLASK_ENV=prod -e DATABASE_URL=sqlite:////tmp/test.db meuapk-flask:ci  # pragma: allowlist secret
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs app
          exit 1
