{% extends 'base.html' %}
{% block conteudo %}
<section class="page-card">
    <span class="page-kicker">Perfil do usuário</span>
    <h2>Olá, {{ nome }} 👋</h2>
    <div class="profile">
        <img class="imgquadrada" src="{{ url_for('static', filename='img/professora.svg') }}" alt="Perfil">
        <div class="profile-data">
            <div class="profile-row"><span>Profissão</span><strong>{{ dados['profissao'] }}</strong></div>
            <div class="profile-row"><span>Disciplina</span><strong>{{ dados['disciplina'] }}</strong></div>
        </div>
    </div>
</section>
{% endblock %}
