{% extends 'base.html' %}

{% block conteudo %}
{% set mensagens = get_flashed_messages() %}
{% if mensagens %}<div class="mensagens-flash"><ul>{% for msg in mensagens %}<li>{{ msg }}</li>{% endfor %}</ul></div>{% endif %}
    <form action="/autenticar" method="POST" > 
        <!-- 

        ao clickar no botão OK, no submit vai para a rota /autenticar -->
        <!-- Quando trabalha com métodos GET (padrão) ou POST (declara method) --> 
        <br/><br/>
       
        Usuário: <input type = "text" name="nome_usuario" ><br/><br/>
        Senha  : <input type = "password" name="senha"><br/><br/>
        <button type = "submit">OK</button>
    </form>

{% endblock %}
